# Runs the whole RaceDay platform: SQL Server, the REST API and the MVC web application.
#   1. Copy .env.example to .env and fill in the values.
#   2. docker compose up --build
#   3. Open http://localhost:8080 (web) or http://localhost:5259/swagger (API).
name: raceday

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/RaceDay.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__RaceDayDb: "Server=sql;Database=RaceDayDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}
      BlobStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:-}
      BlobStorage__ContainerName: ${BLOB_CONTAINER_NAME:-raceday-images}
    ports:
      - "5259:8080"
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      Api__BaseUrl: http://api:8080
    ports:
      - "8080:8080"

volumes:
  sqldata:
